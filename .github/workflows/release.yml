name: Release

# Runs on every merge to main. If extension/package.json has a version that
# hasn't been released yet (no v<version> tag), it builds the extension,
# uploads it to the Chrome Web Store, submits it for review, and creates the
# tag plus a GitHub release with the zip. Merges that don't bump the version
# do nothing. One-time setup is described in RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button, e.g. to retry a failed publish

permissions:
  contents: write # create the tag and GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need tags to tell whether this version is released

      - name: Check for an unreleased version
        id: version
        run: |
          version=$(node -p "require('./extension/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released. Bump the version in extension/package.json to publish." >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Chrome Web Store secrets are set
        if: steps.version.outputs.release == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          missing=""
          for name in EXTENSION_ID PUBLISHER_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            [ -n "${!name}" ] || missing="$missing CHROME_$name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See RELEASING.md, then re-run this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v5
        if: steps.version.outputs.release == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.version.outputs.release == 'true'
        run: npm ci
      - if: steps.version.outputs.release == 'true'
        run: npm run check
      - if: steps.version.outputs.release == 'true'
        run: npm run package

      # The store refuses any upload while a submission is in review, and
      # refuses a version it already has. If this version was already
      # submitted (for example, uploaded by hand), skip the upload and just
      # tag it. If the status check itself fails, try the upload anyway.
      - name: Check whether the store already has this version
        id: store
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          echo "upload=true" >> "$GITHUB_OUTPUT"
          token=$(curl -fsS https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" -d grant_type=refresh_token \
            | jq -r .access_token) || { echo "::warning::Could not get a token to check store status; uploading anyway."; exit 0; }
          status=$(curl -fsS -H "Authorization: Bearer $token" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:fetchStatus") \
            || { echo "::warning::Could not fetch store status; uploading anyway."; exit 0; }
          echo "Store versions: $(jq -c '[.. | .crxVersion? // empty]' <<<"$status")"
          if jq -e --arg v "$VERSION" '[.. | .crxVersion? // empty] | index($v)' <<<"$status" >/dev/null; then
            echo "v$VERSION is already submitted to the Chrome Web Store. Skipping the upload and tagging the release." >> "$GITHUB_STEP_SUMMARY"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to the Chrome Web Store and submit for review
        if: steps.version.outputs.release == 'true' && steps.store.outputs.upload == 'true'
        run: >-
          npx --yes chrome-webstore-upload-cli@4.0.1
          --source "release/heb-grocery-agent-v${{ steps.version.outputs.version }}.zip"
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      # Only tag once the store has accepted the upload, so a failed publish
      # is retried by the next merge or the "Run workflow" button.
      - name: Tag and create GitHub release
        if: steps.version.outputs.release == 'true'
        run: >-
          gh release create "v${{ steps.version.outputs.version }}"
          "release/heb-grocery-agent-v${{ steps.version.outputs.version }}.zip"
          --target "$GITHUB_SHA"
          --title "v${{ steps.version.outputs.version }}"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
