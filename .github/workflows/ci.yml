name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - id: version
        run: echo "version=$(node -p "require('./extension/package.json').version")" >> "$GITHUB_OUTPUT"
      # Upload the contents of dist/ rather than the release zip. GitHub always
      # zips artifacts, so uploading a zip would nest it inside another zip.
      # This way the downloaded artifact has manifest.json at its root and can
      # go straight to the Chrome Web Store.
      - uses: actions/upload-artifact@v4
        with:
          name: heb-grocery-agent-v${{ steps.version.outputs.version }}
          path: extension/dist/
          if-no-files-found: error
